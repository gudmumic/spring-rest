version: '3.8'
services:
  db:
    image: mysql
    restart: always
    environment:
      MYSQL_DATABASE: "restdb"
      # So you don't have to use root, but you can if you like
      MYSQL_USER: "mnsen"
      # You can use whatever password you like
      MYSQL_PASSWORD: "Nielsen2509"
      # Password for root access
      MYSQL_ROOT_PASSWORD: "password"
    ports:
      # <Port exposed> : <MySQL Port running inside container>
      - "3306:3306"
    networks:
      - vpcbr
    expose:
      # Opens port 3306 on the container
      - "3306"
      # Where our data will be persisted
    volumes:
      - ~/Development/mysql-db:/var/lib/mysql

networks:
  vpcbr:
    driver: bridge
    ipam:
      config:
        - subnet: 172.172.0.0/16
          gateway: 172.172.0.1
          aux_addresses:
            mysql: 172.172.0.2
# Names our volume
volumes:
  my-db: